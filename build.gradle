plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

loom {
	accessWidenerPath = file("src/main/resources/spb-revamped.accesswidener")
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Cardinal Components (Ladysnake)
	maven {
		name = "Ladysnake Mods"
		url = 'https://maven.ladysnake.org/releases'
	}

	// Mod Menu
	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/"
	}

	// GeckoLib
	maven {
		url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
		content {
			includeGroupByRegex("software\\.bernie.*")
			includeGroup("com.eliotlash.mclib")
		}
	}

	// Simple Voice Chat
	maven {
		url = 'https://maven.maxhenkel.de/repository/public'
	}

	// Modrinth (MidnightLib, SVC, compat mods)
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content {
			includeGroup "maven.modrinth"
		}
	}

	mavenCentral()
}

fabricApi {
	configureDataGeneration()
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// GeckoLib (entity animation/rendering) — via Modrinth maven (cloudsmith artifact name changed in v5)
	implementation "maven.modrinth:geckolib:${project.geckolib_version}"

	// Cardinal Components API — bundled via JIJ (org.ladysnake group as of v6+)
	implementation "org.ladysnake.cardinal-components-api:cardinal-components-base:${project.cca_version}"
	implementation "org.ladysnake.cardinal-components-api:cardinal-components-entity:${project.cca_version}"
	implementation "org.ladysnake.cardinal-components-api:cardinal-components-world:${project.cca_version}"
	include "org.ladysnake.cardinal-components-api:cardinal-components-base:${project.cca_version}"
	include "org.ladysnake.cardinal-components-api:cardinal-components-entity:${project.cca_version}"
	include "org.ladysnake.cardinal-components-api:cardinal-components-world:${project.cca_version}"

	// Mod Menu — via Modrinth maven
	implementation "maven.modrinth:modmenu:${project.modmenu_version}"

	// MidnightLib (config) — bundled via JIJ
	implementation "maven.modrinth:midnightlib:${project.midnightlib_version}"
	include "maven.modrinth:midnightlib:${project.midnightlib_version}"

	// Simple Voice Chat (mod + compile-time API)
	implementation "maven.modrinth:simple-voice-chat:${project.voicechat_version}"
	implementation "de.maxhenkel.voicechat:voicechat-api:${project.voicechat_api_version}"

	// Compat (Sound Physics Remastered) — compile-only soft-dependency so the
	// mixin/soundphysicsremasteredcompat/* mixins resolve com.sonicether.* at compile time.
	// (This build uses plain Gradle configs for its mod deps, not Loom's mod* configs.)
	// Guarded at runtime via FabricLoader.isModLoaded("sound_physics_remastered").
	compileOnly "maven.modrinth:sound-physics-remastered:${project.sound_physics_remastered_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
	}
}
